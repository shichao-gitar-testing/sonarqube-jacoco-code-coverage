name: CI and SonarQube Cloud

on:
  push:
    branches:
      - 'master'
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java-version: [11,17]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java-version }}
          distribution: temurin
          cache: gradle
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build with Gradle
        run: ./gradlew --no-daemon build

  sonar:
    name: SonarQube Cloud analysis
    runs-on: ubuntu-latest
    # Secrets are unavailable to pull requests from forks and Dependabot.
    if: >-
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: temurin
          cache: gradle
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@v4
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar-
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Build, generate coverage, and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PROJECT_KEY: shichao-gitar-testing_sonarqube-jacoco-code-coverage
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
        shell: bash
        run: |
          : "${SONAR_TOKEN:?Set the SONAR_TOKEN repository secret}"
          : "${SONAR_ORGANIZATION:?Set SONAR_ORGANIZATION to your SonarQube Cloud organization key}"

          # GitHub Actions auto-detection selects branch analysis for pushes
          # and PR analysis for pull_request events. Do not force branch
          # parameters here, since that would override PR detection.
          # sonar.login supports this repo's older Gradle scanner.
          # Clear the hard-coded admin password from build.gradle.
          ./gradlew --no-daemon build jacocoTestReport sonar \
            -Dsonar.host.url="$SONAR_HOST_URL" \
            -Dsonar.projectKey="$SONAR_PROJECT_KEY" \
            -Dsonar.organization="$SONAR_ORGANIZATION" \
            -Dsonar.login="$SONAR_TOKEN" \
            -Dsonar.password= \
            -Dsonar.coverage.jacoco.xmlReportPaths=build/reports/jacoco/test/jacocoTestReport.xml \
            -Dsonar.qualitygate.wait=true


